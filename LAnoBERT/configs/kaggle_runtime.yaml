# Kaggle smoke-run configuration.
# Use this file to verify the full BGL pipeline before the full experiment.
dataset: BGL
run_name: kaggle_runtime

paths:
  raw_log: data/BGL/BGL.log
  train_raw: data/BGL/BGL_train_normal.raw
  test_raw: data/BGL/BGL_test.raw
  test_label: data/BGL/BGL_test_label.log
  train_normal: data/BGL/BGL_train_normal_parsed.log
  test_log: data/BGL/BGL_test_parsed.log
  tokenizer_dir: outputs/BGL/tokenizer
  model_dir: outputs/BGL/model
  result_dir: outputs/BGL/results

split:
  method: line
  train_ratio: 0.8
  label_marker: "-"

preprocess:
  regex_profile: bgl
  mask_block_id: true
  mask_ip: true
  mask_number: true
  drop_header_fields: 3

tokenizer:
  vocab_size: 1000
  min_frequency: 2
  lowercase: false

train:
  max_len: 512
  mlm_probability: 0.20
  num_train_epochs: 1
  # Smoke-run cap to avoid holding the full 3.5M-line corpus in Kaggle RAM.
  # Set to null for a full training run.
  max_train_samples: 10000
  per_device_train_batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  save_steps: 50000
  save_total_limit: 2
  logging_steps: 1000
  seed: 42

inference:
  hf_model: null
  hf_subfolder: null
  score: error_mean
  top_k: 5
  top_ks: [1, 2, 3, 4, 5]
  batch_size: 16
  max_eval_samples: 10000
  pretrained_model: null

h_rag:
  field_value:
    max_response_time_ms: null
    max_heartbeat_interval_s: null
    critical_severities: [CRITICAL, FATAL, ERROR]
    blacklisted_hosts: []
  fusion:
    hidden_dim: 64
